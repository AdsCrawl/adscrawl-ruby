name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ['3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Check syntax
        run: find lib examples test -name '*.rb' -print0 | xargs -0 -n1 ruby -c
      - run: bundle exec rake test
      - name: Build and install the gem
        run: |
          gem build adscrawl.gemspec
          gem install ./adscrawl-*.gem
          ruby -e 'require "adscrawl"; puts AdsCrawl::VERSION'
